<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HawkerHub | Choose your role</title>
  <link rel="stylesheet" href="Css/css.css">
  <link rel="stylesheet" href="Css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <header class="navbar"><div class="logo" onclick="window.location='Home-Page.html'">Hawker<span>Hub</span></div></header>
  <main class="auth-container">
    <section class="auth-card" aria-labelledby="role-heading">
      <span class="hero-tag">Almost there</span>
      <h1 id="role-heading">How will you use HawkerHub?</h1>
      <p>Choose a role to finish creating your Google account. You can sign in straight away after making your choice.</p>
      <div class="role-options">
        <button class="role-option" type="button" data-role="patron">
          <strong>🍜 I’m a patron</strong>
          <span>Order meals, discover stalls and earn rewards.</span>
        </button>
        <button class="role-option" type="button" data-role="vendor">
          <strong>🏪 I’m a vendor</strong>
          <span>Manage your stall, menu and rental agreements.</span>
        </button>
      </div>
      <p class="google-note">Your selected role is saved to your HawkerHub account.</p>
      <div class="auth-footer"><a href="Login.html">Back to sign in</a></div>
    </section>
  </main>
  <script src="Js/google-role-selection.js"></script>
</body>
</html>
