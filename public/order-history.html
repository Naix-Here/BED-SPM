<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — SHCMS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/something.css" />
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="page-shell">
    <div class="page-title">
      <h1>My Orders</h1>
      <p id="subtitle">Your order history. Tap an order to see details.</p>
    </div>

    <div id="guestNotice" class="empty-state" style="display:none;">
      <i class="fa-solid fa-receipt" style="color:var(--accent);"></i>
      <p>You're browsing as a guest. <a href="/login.html" class="text-link">Log in</a> to see orders across devices, or place a new order from the <a href="/stalls.html" class="text-link">stalls</a>.</p>
    </div>

    <div class="order-list" id="orderList">
      <div class="order-card">
        <div class="order-icon"><i class="fa-solid fa-hourglass-half"></i></div>
        <div><h3>Loading your orders…</h3><p>Just a moment.</p></div>
        <div class="order-price"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <p>&copy; <span id="footer-year"></span> SHCMS — Singapore Hawker Centre Management System. All rights reserved.</p>
      <div class="footer-socials">
        <a href="/credit.html" title="Credits"><i class="fa-solid fa-circle-info"></i></a>
      </div>
    </div>
  </footer>

  <script src="/js/shared.js"></script>
  <script src="/js/order-history.js"></script>
  <script>renderNavbar('orders');</script>
</body>
</html>
