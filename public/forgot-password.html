<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset password</title><link rel="stylesheet" href="/css/shared.css"></head>
<body><main style="padding:60px 6%;max-width:540px;margin:0 auto"><div style="background:var(--card-bg);border:1px solid var(--border-subtle);border-radius:20px;padding:36px"><h1>Reset your password</h1><p style="color:var(--text-dimmed);margin:8px 0 24px">Enter your email and we’ll send a reset link.</p><div id="message" style="display:none;margin-bottom:16px"></div><input id="email" type="email" placeholder="you@example.com" style="width:100%;padding:12px;background:#070c16;border:1px solid var(--border-subtle);color:#fff;border-radius:10px;box-sizing:border-box"><button class="btn btn-primary btn-full" id="request-reset" style="margin-top:16px" type="button">Send reset link</button></div></main><script src="/js/shared.js"></script><script src="/js/auth.js"></script></body></html>
