<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose a new password</title><link rel="stylesheet" href="/css/shared.css"></head>
<body><main style="padding:60px 6%;max-width:540px;margin:0 auto"><div style="background:var(--card-bg);border:1px solid var(--border-subtle);border-radius:20px;padding:36px"><h1>Choose a new password</h1><p style="color:var(--text-dimmed);margin:8px 0 24px">Use at least 8 characters with a letter and number.</p><div id="message" style="display:none;margin-bottom:16px"></div><input id="password" type="password" placeholder="New password" style="width:100%;padding:12px;background:#070c16;border:1px solid var(--border-subtle);color:#fff;border-radius:10px;box-sizing:border-box"><button class="btn btn-primary btn-full" id="confirm-reset" style="margin-top:16px" type="button">Reset password</button></div></main><script src="/js/shared.js"></script><script src="/js/auth.js"></script></body></html>
