<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback & Reviews — SG Hawker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/shared.css" />
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="page-container">
    <h1>Feedback & Reviews</h1>
    <p class="page-sub">Share your dining experience to help fellow foodies.</p>

    <div id="page-notice" hidden></div>

    <div style="display:grid; grid-template-columns:1fr 1.6fr; gap:24px; align-items:start;">
      <!-- Form -->
      <div class="card" style="background:var(--card-bg); border:1px solid var(--border-subtle); border-radius:18px; padding:24px;">
        <h2 style="font-size:1.2rem; margin-bottom:14px;">Write a Review</h2>
        <div class="form-group">
          <label>Stall</label>
          <select id="fb-stall"></select>
        </div>
        <div class="form-group">
          <label>Rating</label>
          <div id="star-rating" style="display:flex; gap:6px; font-size:1.6rem; cursor:pointer;">
            <i class="fa-solid fa-star" data-val="1" style="color:#eab308;"></i>
            <i class="fa-solid fa-star" data-val="2" style="color:#eab308;"></i>
            <i class="fa-solid fa-star" data-val="3" style="color:#eab308;"></i>
            <i class="fa-solid fa-star" data-val="4" style="color:#eab308;"></i>
            <i class="fa-solid fa-star" data-val="5" style="color:#eab308;"></i>
          </div>
        </div>
        <div class="form-group">
          <label>Comment (optional)</label>
          <textarea id="fb-comment" rows="4" placeholder="What did you like or dislike?" maxlength="1000"></textarea>
        </div>
        <button class="btn btn-primary" id="submit-btn" type="button">Submit Review</button>
      </div>

      <!-- List -->
      <div>
        <div class="filter-bar" style="margin-bottom:14px;">
          <label style="color:var(--text-dimmed); font-size:0.88rem;">Filter by stall:</label>
          <select id="filter-stall" style="background:rgba(0,0,0,.24); color:#fff; border:1px solid var(--border-subtle); border-radius:10px; padding:8px 12px;">
            <option value="">All stalls</option>
          </select>
        </div>
        <div id="reviews-list"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="footer-year"></span> SG Hawker — Singapore Hawker Centre Management System</p>
  </footer>

  <script src="/js/shared.js"></script>
  <script src="/js/feedback.js"></script>
</body>
</html>
