<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Management — SHCMS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/vendor.css" />
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="page-shell">
    <div class="page-title-row">
      <div>
        <h1>Menu Management</h1>
        <p id="stallName" style="color:var(--muted);">Loading your stall…</p>
      </div>
      <button class="btn btn-primary" id="addBtn">
        <i class="fa-solid fa-plus"></i> &nbsp;Add Menu Item
      </button>
    </div>

    <div class="filter-bar">
      <input type="search" id="searchInput" placeholder="Search items…" style="flex:1;min-width:200px;" />
      <select id="categoryFilter">
        <option value="">All categories</option>
        <option>Main</option><option>Drink</option><option>Dessert</option><option>Snack</option><option>Side</option>
      </select>
      <select id="availableFilter">
        <option value="">All</option>
        <option value="available">Available</option>
        <option value="unavailable">Unavailable</option>
      </select>
    </div>

    <div id="itemGrid" class="item-grid">
      <div class="empty-state">Loading your menu…</div>
    </div>
  </main>

  <!-- Add/Edit modal -->
  <div class="modal-overlay" id="itemModal">
    <div class="modal">
      <h2 id="modalTitle">Add Menu Item</h2>
      <form id="itemForm">
        <input type="hidden" id="menuItemId" />
        <div class="form-group">
          <label>Name *</label>
          <input type="text" id="itemName" required maxlength="100" />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="itemDescription" maxlength="500" rows="3"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Price (SGD) *</label>
            <input type="number" id="itemPrice" step="0.01" min="0.01" required />
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="itemCategory" required>
              <option value="Main">Main</option>
              <option value="Drink">Drink</option>
              <option value="Dessert">Dessert</option>
              <option value="Snack">Snack</option>
              <option value="Side">Side</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="itemIsAvailable" checked style="width:auto;margin-right:8px;" />
            Available for ordering
          </label>
        </div>
        <div class="form-group">
          <label>Cuisines</label>
          <div id="cuisineList" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <p>&copy; <span id="footer-year"></span> SHCMS — Singapore Hawker Centre Management System. All rights reserved.</p>
      <div class="footer-socials">
        <a href="/credit.html" title="Credits"><i class="fa-solid fa-circle-info"></i></a>
      </div>
    </div>
  </footer>

  <script src="/js/shared.js"></script>
  <script src="/js/vendor-menu.js"></script>
  <script>renderNavbar('menu');</script>
</body>
</html>
