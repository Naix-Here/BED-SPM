<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEA Inspections — SG Hawker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/vendor.css" />
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="page-shell">
    <div class="page-title">
      <span class="eyebrow">NEA Officer Portal</span>
      <h1>Inspection Log</h1>
      <p>Record hygiene inspections and issue official grades.</p>
    </div>

    <div id="page-notice" hidden></div>

    <!-- Inspection form -->
    <section class="panel">
      <h2>Log New Inspection</h2>
      <form id="insp-form">
        <div class="form-row">
          <div class="form-group">
            <label>Stall *</label>
            <select id="i-stall" required></select>
          </div>
          <div class="form-group">
            <label>Inspection Date *</label>
            <input type="date" id="i-date" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Score (0-100) *</label>
            <input type="number" id="i-score" min="0" max="100" step="0.01" required />
          </div>
          <div class="form-group">
            <label>Grade Issued *</label>
            <select id="i-grade" required>
              <option value="A">A — Excellent</option>
              <option value="B">B — Good</option>
              <option value="C">C — Pass</option>
              <option value="D">D — Fail</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Remarks</label>
          <textarea id="i-remarks" rows="3" maxlength="2000" placeholder="Notes about this inspection..."></textarea>
        </div>
        <div class="form-actions">
          <button type="reset" class="btn btn-secondary">Reset</button>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Inspection</button>
        </div>
      </form>
    </section>

    <section class="panel panel-spaced">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="margin:0;">Recent Inspections</h2>
        <div class="filter-bar">
          <label style="font-size:0.85rem; color:var(--text-dimmed);">Filter:</label>
          <select id="filter-stall">
            <option value="">All stalls</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Stall</th>
              <th>Date</th>
              <th>Score</th>
              <th>Grade</th>
              <th>Officer</th>
              <th>Remarks</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="insp-tbody">
            <tr><td colspan="7" style="text-align:center; color:var(--text-dimmed);">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="footer-year"></span> SG Hawker — Singapore Hawker Centre Management System</p>
  </footer>

  <script src="/js/shared.js"></script>
  <script src="/js/nea-inspections.js"></script>
</body>
</html>
