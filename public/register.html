<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — SG Hawker</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main style="padding: 60px 6%; max-width: 540px; margin: 0 auto;">
    <div style="background: var(--card-bg); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 36px;">
      <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Create Account</h1>
      <p style="color: var(--text-dimmed); margin-bottom: 28px;">Join SG Hawker to order, review, and earn rewards.</p>

      <div id="register-error" style="display:none; padding:12px 16px; background:var(--danger-soft); color:var(--danger); border-radius:10px; margin-bottom:20px; font-size:0.88rem;"></div>

      <div style="margin-bottom: 18px;">
        <label style="display:block; color:var(--text-dimmed); font-size:0.82rem; font-weight:600; margin-bottom:6px;">Full Name</label>
        <input type="text" id="fullName" placeholder="Alice Tan" style="width:100%; padding:12px; background:#070c16; border:1px solid var(--border-subtle); color:#fff; border-radius:10px; outline:none; font:inherit;" />
      </div>

      <div style="margin-bottom: 18px;">
        <label style="display:block; color:var(--text-dimmed); font-size:0.82rem; font-weight:600; margin-bottom:6px;">Email</label>
        <input type="email" id="email" placeholder="you@example.com" style="width:100%; padding:12px; background:#070c16; border:1px solid var(--border-subtle); color:#fff; border-radius:10px; outline:none; font:inherit;" />
      </div>

      <div style="margin-bottom: 18px;">
        <label style="display:block; color:var(--text-dimmed); font-size:0.82rem; font-weight:600; margin-bottom:6px;">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters, 1 letter and 1 number" style="width:100%; padding:12px; background:#070c16; border:1px solid var(--border-subtle); color:#fff; border-radius:10px; outline:none; font:inherit;" />
      </div>

      <div style="margin-bottom: 18px;">
        <label style="display:block; color:var(--text-dimmed); font-size:0.82rem; font-weight:600; margin-bottom:6px;">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password" style="width:100%; padding:12px; background:#070c16; border:1px solid var(--border-subtle); color:#fff; border-radius:10px; outline:none; font:inherit;" />
      </div>

      <div style="margin-bottom: 18px;">
        <label style="display:block; color:var(--text-dimmed); font-size:0.82rem; font-weight:600; margin-bottom:6px;">Account Type</label>
        <select id="role" style="width:100%; padding:12px; background:#070c16; border:1px solid var(--border-subtle); color:#fff; border-radius:10px; outline:none; font:inherit;">
          <option value="Customer">Customer</option>
          <option value="Vendor">Vendor</option>
          <option value="NEAOfficer">NEA Officer</option>
          <option value="Operator">Operator</option>
        </select>
      </div>

      <div id="vendor-extra" style="display:none; margin-bottom: 18px;">
        <label style="display:block; color:var(--text-dimmed); font-size:0.82rem; font-weight:600; margin-bottom:6px;">Business Name (optional)</label>
        <input type="text" id="businessName" placeholder="e.g. Uncle Chen's Hainan Chicken" style="width:100%; padding:12px; background:#070c16; border:1px solid var(--border-subtle); color:#fff; border-radius:10px; outline:none; font:inherit;" />
      </div>

      <button class="btn btn-primary btn-full btn-large" id="register-btn" type="button">Create Account</button>

      <p style="text-align:center; margin-top:22px; color:var(--text-dimmed); font-size:0.88rem;">
        Already have an account? <a href="/login.html" style="color:var(--accent); text-decoration:none; font-weight:600;">Sign in</a>
      </p>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <p>&copy; <span id="footer-year"></span> SG Hawker — Singapore Hawker Centre Management System</p>
    </div>
  </footer>

  <script src="/js/shared.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Show business name field when Vendor is selected
    document.getElementById('role').addEventListener('change', (e) => {
      document.getElementById('vendor-extra').style.display = e.target.value === 'Vendor' ? 'block' : 'none';
    });
  </script>
</body>
</html>
