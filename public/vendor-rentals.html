<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rental Agreements — SHCMS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/vendor.css" />
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="page-shell">
    <div class="page-title-row">
      <div>
        <h1>Rental Agreements</h1>
        <p id="subtitle" style="color:var(--muted);">Loading…</p>
      </div>
      <button class="btn btn-primary" id="addBtn" style="display:none;">
        <i class="fa-solid fa-plus"></i> &nbsp;New Agreement
      </button>
    </div>

    <div id="rentalList">
      <div class="empty-state">Loading agreements…</div>
    </div>
  </main>

  <!-- Add/Edit modal -->
  <div class="modal-overlay" id="agreementModal">
    <div class="modal">
      <h2 id="modalTitle">New Rental Agreement</h2>
      <form id="agreementForm">
        <input type="hidden" id="agreementId" />
        <div class="form-group">
          <label>Stall *</label>
          <select id="stallId" required>
            <option value="">Select a stall…</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Monthly Rent (SGD) *</label>
            <input type="number" id="monthlyRent" step="0.01" min="0.01" required />
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="Active">Active</option>
              <option value="Expired">Expired</option>
              <option value="Terminated">Terminated</option>
              <option value="Renewed">Renewed</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Start Date *</label>
            <input type="date" id="startDate" required />
          </div>
          <div class="form-group">
            <label>End Date (leave blank if ongoing)</label>
            <input type="date" id="endDate" />
          </div>
        </div>
        <div class="form-group">
          <label>Terms</label>
          <textarea id="terms" maxlength="2000" rows="4"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <p>&copy; <span id="footer-year"></span> SHCMS — Singapore Hawker Centre Management System. All rights reserved.</p>
      <div class="footer-socials">
        <a href="/credit.html" title="Credits"><i class="fa-solid fa-circle-info"></i></a>
      </div>
    </div>
  </footer>

  <script src="/js/shared.js"></script>
  <script src="/js/vendor-rentals.js"></script>
  <script>renderNavbar('rentals');</script>
</body>
</html>
